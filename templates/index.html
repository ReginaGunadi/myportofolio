<!DOCTYPE html>
<html lang="en">

{% extends 'base.html' %}
{% block content %}
<!-- Bagian About Me -->
    <main>
    <section class="hero" id="profile">
        <div class="container hero-grid">
            <div class="hero-identity">
                <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                <h1>{{ name }}</h1>
            </div>
            <div class="hero-photo">
                <div class="photo-block"></div>
                <img class="avatar" src="/static/img/Regina_Gunadi_2.JPG" alt="Photo of {{ name }}">
            </div>
            <div class="hero-details">
                <b class="bio">{{ bio }}</b>
                <dl class="meta-list">
                    <div class="meta-row">
                        <dt>NPM</dt>
                        <dd>{{ npm }}</dd>
                    </div>
                    <div class="meta-row">
                        <dt>Program</dt>
                        <dd>{{ study_program }}</dd>
                    </div>
                    <div class="meta-row">
                        <dt>Sesi Terakhir Login</dt>
                        <dd>{{ last_login }}</dd>
                    </div>
                </dl>
                <div class="social-links">
                    <a href="https://github.com/ReginaGunadi" class="social-link">GitHub</a>
                    <a href="https://linkedin.com/in/regina-gunadi-a170322b2" class="social-link">LinkedIn</a>
                    <a href="mailto:reginagunadi190507@gmail.com" class="social-link">Email</a>
                </div>
            </div>
        </div>
    </section>
    </main>
    {% endblock content %}
</html>
